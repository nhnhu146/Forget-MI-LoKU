# ============================================================================
# CONFIG cho Forget-MI BASELINE — Indiana University CXR — Kaggle
# ============================================================================
# ⚠️ SKELETON FILE — Cần update sau khi prep IU dataset xong.
#
# Khi dùng:
#   1. Preprocess IU theo Section 13 của THESIS_ROADMAP.md (download, parse XML,
#      sinh label binary normal/abnormal, tạo splits, retrain models)
#   2. Upload Kaggle Datasets: forget-mi-data-iu + forget-mi-models-iu
#   3. Set DATASETS['iu']['enabled'] = True trong Cell 3 của run_kaggle_baseline.ipynb
#   4. Chạy Cell 4d/4e/4f
#
# So với config MIMIC, các thay đổi chính:
#   - paths trỏ tới /kaggle/input/forget-mi-*-iu/
#   - output_channel_encoding: binary  (thay vì multiclass — IU không có edema 4-level)
#   - num_labels ngầm = 2 (binary)
#   - data_split_path + forget_set_path trỏ tới splits IU
#   - Có thể giảm unlearn_epochs nếu IU dataset nhỏ hơn (~3.9K reports vs 6.7K MIMIC)
# ============================================================================
program: training/forgetmi_partial.py
method: random
parameters:
  # ===== WandB (disabled trên Kaggle qua env WANDB_MODE=disabled) =====
  wandb_project:
    value: "forget_mi_baseline_iu"
  wandb_entity:
    value: null

  # ===== Data paths (IU on Kaggle — new format /datasets/<user>/) =====
  # Notebook Cell 2 auto-detect + override paths này.
  base_model_path:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-models-iu/base_model/model_og_IU"
  retrained_model_path:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-models-iu/retrained_model/model_retrained_iu_3per"
  bert_pretrained_dir:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-models-iu/base_model/model_og_IU"
  text_data_dir:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-data-iu/data/metadata"
  img_data_dir:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-data-iu/data/img_data"
  data_split_path:
    value: "./data_iu/data_splits/iu-split.csv"
  synonyms_dir:
    value: "./data_splits/Synonyms.csv"                      # reuse MIMIC synonyms
  forget_set_path:
    value: "./data_iu/data_splits/forget_set_3per_iu.csv"    # override qua CLI cho 6%/10%
  output_dir:
    value: "/kaggle/working/baseline_iu_output"

  # ===== Dataset prep =====
  max_seq_length:
    value: 320                                               # PHẢI khớp giữa train/baseline/loku
                                                             # (cache features = ..._seqlen-320_...)
  text_noise_level:
    value: 0.5
  output_channel_encoding:
    value: "multiclass"                                      # IU binary 0/1 đi qua head 4-class
                                                             # (convert_to_onehot). 'binary' KHÔNG
                                                             # được data loader hỗ trợ → sẽ crash.
  reprocess_input_data:
    value: false
  validation_ratio:
    value: 0.1
  random_point_ratio:
    value: 0.1
  random_seed:
    value: 42
  id:
    value: "baseline_iu_3per"

  # ===== Training =====
  do_train:
    value: true
  do_eval:
    value: false
  overwrite_output_dir:
    value: true
  use_noise:
    value: false
  learning_rate:
    value: 1.0e-5                                            # khớp MIMIC (paper validated value)
  weight_decay:
    value: 0.01
  unlearn_epochs:
    value: 30                                                # khớp MIMIC để fair comparison
  scheduler:
    value: "ReduceLROnPlateau"
  warmup_proportion:
    value: 0.1
  unlearn_batch_size:
    value: 16
  eval_batch_size:
    value: 16
  eval_max_retain:
    value: 512
  mia_paper_batch_size:
    value: 32
  num_cpu_workers:
    value: 2
  max_grad_norm:
    value: 1.0

  # ===== Noise =====
  noise_mean:
    value: 0
  noise_std:
    value: 0.1

  # ===== Loss weights — "Unimodal" setting (same as MIMIC baseline) =====
  alpha:
    value: 4                                                 # UR
  beta:
    value: 4                                                 # UU
  theta:
    value: 1                                                 # MU
  gamma:
    value: 1                                                 # MR

  # ===== Model architecture flags =====
  bert_pool_last_hidden:
    value: false
  bert_pool_use_img:
    value: false
  bert_pool_img_lowerlevel:
    value: false

  # ===== Misc =====
  use_text_data_dir:
    value: false
  use_data_split_path:
    value: false
  training_mode:
    value: "supervised"
  semisupervised_training_data:
    value: "allCXR"
  use_masked_txt:
    value: false
  use_all_data:
    value: false
  use_pretrained_checkpoint:
    value: false
  print_predictions:
    value: false
  print_embeddings:
    value: false
  logging_steps:
    value: 50
  save_epochs:
    value: 5

command:
  - ${env:PYTHON}
  - training/forgetmi_partial.py
  - --config=config_baseline_iu_kaggle.yaml
