# ============================================================================
# CONFIG cho Forget-MI BASELINE trên Kaggle
# ============================================================================
# File này dùng cho `training/forgetmi_partial.py` (baseline GỐC, không LoKU).
# Khác config.yaml (LoKU) ở chỗ:
#   - Paths trỏ tới /kaggle/input/ và /kaggle/working/
#   - KHÔNG có các params LoKU-specific (lora_*, ihl_*, distill_*, kappa_*, fila_*)
#   - Loss weights theo "Unimodal" setting paper (best ở 3%)
#
# Cách chạy (trong notebook Kaggle):
#   !PYTHONPATH=. WANDB_MODE=disabled python training/forgetmi_partial.py \
#       --config config_baseline_kaggle.yaml --seed 42 \
#       --override "forget_set_path=./data_splits/forget_set_3per.csv,id=baseline_3per_s42" \
#       --exp baseline_3per_seed42 --hypothesis "Reproduce paper Table 2 3% Unimodal"
#
# Đổi forget% qua --override:
#   forget_set_path=./data_splits/forget_set_6per.csv  → 6%
#   forget_set_path=./data_splits/forget_set_10per.csv → 10%
# ============================================================================
program: training/forgetmi_partial.py
method: random
parameters:
  # ===== WandB (disabled trên Kaggle qua env WANDB_MODE=disabled) =====
  wandb_project:
    value: "forget_mi_baseline"
  wandb_entity:
    value: null                                              # null = không gắn entity (tránh fail)

  # ===== Data paths (KAGGLE: dataset đã upload vào /kaggle/input/) =====
  # ⚠️ Kaggle có 2 format mount paths:
  #   Cũ: /kaggle/input/<slug>/...
  #   Mới: /kaggle/input/datasets/<username>/<slug>/...   ← format hiện tại
  # Notebook (Cell 3) sẽ AUTO-DETECT và override paths này.
  # Default values dưới đây là cho format MỚI với username nhnhu146:
  base_model_path:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-models/base_model/training_original_model"
  retrained_model_path:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-models/retrained_model/model_retrained_3per"
  bert_pretrained_dir:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-models/base_model/training_original_model"
  # Default cho format MỚI Kaggle. Notebook Cell 3 auto-detect và override.
  text_data_dir:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-data/data/metadata"
  img_data_dir:
    value: "/kaggle/input/datasets/nhnhu146/forget-mi-data/data/img_data"
  data_split_path:
    value: "./data_splits/mimic-cxr-sub-img-edema-split-manualtest.csv"
  synonyms_dir:
    value: "./data_splits/Synonyms.csv"
  forget_set_path:
    value: "./data_splits/forget_set_3per.csv"               # default 3% — override qua CLI
  output_dir:
    value: "/kaggle/working/baseline_output"                 # Kaggle output dir

  # ===== Dataset prep =====
  max_seq_length:
    value: 320
  text_noise_level:
    value: 0.5
  output_channel_encoding:
    value: "multiclass"
  reprocess_input_data:
    value: false
  validation_ratio:
    value: 0.1                                               # KHÔNG còn dùng (xem test_sel_splits/retain_heldout_splits)
  random_point_ratio:
    value: 0.1                                               # KHÔNG còn dùng
  # Holdout DÙNG CHUNG với P3 (config_advanced_kaggle.yaml) — phải giữ y hệt để hai
  # phương pháp đánh giá trên CÙNG các mẫu: test → 25% sel + 75% test_final;
  # D_r → 10% r_heldout (validation, không train) + 90% retain.
  test_sel_splits:
    value: 4
  retain_heldout_splits:
    value: 10
  random_seed:
    value: 42                                                # override qua --seed
  id:
    value: "baseline_3per"

  # ===== Training =====
  do_train:
    value: true
  do_eval:
    value: false
  overwrite_output_dir:
    value: true
  use_noise:
    # true = mô tả ĐÚNG thực nghiệm: tập random LUÔN là bản nhiễu (ảnh Gaussian σ=0.1 +
    # text perturbation), và UU/MU = −Dist tới bản nhiễu đó theo Eq.(1)-(2).
    # Cờ này KHÔNG còn điều khiển gì trong code (ở bản gốc nó chỉ đảo dấu loss; nay cả hai
    # nhánh đã về −Dist nên nhánh rẽ bị gộp). Giữ = true để config/log không nói sai.
    value: true
  learning_rate:
    value: 1.0e-5                                            # paper Section 3 mentions both 1e-4 and 1e-5 — using 1e-5 (lower) to avoid over-forgetting on subset 3%
  weight_decay:
    value: 0.01
  unlearn_epochs:
    value: 30                                                # paper: 30 epochs
  evaluate_last_and_best:
    value: true                                              # one run -> last + val-best
  selection_max_validation:
    value: 400                                               # same deterministic validation subset as LoKU
  selection_min_delta:
    value: 0.0
  legacy_cossim_monitor:
    value: false                                             # gold-model CosSim is evaluation, never selection
  scheduler:
    value: "ReduceLROnPlateau"
  warmup_proportion:
    value: 0.1
  unlearn_batch_size:
    value: 16                                                # paper value (giữ nguyên để khớp Forget-MI gốc)
  eval_batch_size:
    value: 16                                                # paper value
  eval_max_retain:
    value: 512                                               # cap retain forwards in eval
  mia_paper_batch_size:
    value: 32
  num_cpu_workers:
    value: 2
  # Phải TRÙNG config_advanced_kaggle.yaml (mục 16 hướng dẫn đo thời gian):
  # workers + pin_memory giống hệt thì T_train hai phương pháp mới so được.
  dataloader_pin_memory:
    value: true
  max_grad_norm:
    value: 1.0

  # ===== Noise — LUÔN áp cho tập random (không phụ thuộc cờ use_noise) =====
  noise_mean:
    value: 0
  noise_std:
    value: 0.1

  # ===== Loss weights — ĐÚNG config.yaml GỐC của paper (alpha=1,beta=1,theta=2,gamma=2) =====
  # Chuẩn hóa: 0.17/0.17/0.33/0.33 (Multimodal-leaning). KHÔNG dùng 4/4/1/1 ("Unimodal")
  # vì beta(UU) cao + L_uu = −Dist (đẩy-ra-xa không chặn theo Eq.(1)) → over-forget.
  # Code maps: alpha=UKR(giữ uni), beta=UU(quên uni), theta=MD(quên multi), gamma=MKR(giữ multi)
  alpha:
    value: 1                                                 # UKR weight (raw, sẽ normalize)
  beta:
    value: 1                                                 # UU weight
  theta:
    value: 2                                                 # MD weight
  gamma:
    value: 2                                                 # MR weight

  # ===== Model architecture flags =====
  bert_pool_last_hidden:
    value: false
  bert_pool_use_img:
    value: false
  bert_pool_img_lowerlevel:
    value: false

  # ===== Misc (cho tương thích với shared modules) =====
  use_text_data_dir:
    value: false
  use_data_split_path:
    value: false
  training_mode:
    value: "supervised"
  semisupervised_training_data:
    value: "allCXR"
  use_masked_txt:
    value: false
  use_all_data:
    value: false
  use_pretrained_checkpoint:
    value: false
  print_predictions:
    value: false
  print_embeddings:
    value: false
  logging_steps:
    value: 50
  save_epochs:
    value: 5

command:
  - ${env:PYTHON}
  - training/forgetmi_partial.py
  - --config=config_baseline_kaggle.yaml
